[build-system]
requires = ["setuptools>=62.3"]
build-backend = "setuptools.build_meta"

[project]
name = "resilient-triage"
version = "2.0.0"
description = "Fault-tolerant incident triage agent powered by LangGraph, Tenacity, Pybreaker, and Redis Semantic Cache"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=1.0,<2",
    "langchain-core>=0.2.0",
    "tenacity>=8.2.3",
    "pybreaker>=1.3.0,<1.5",
    "httpx>=0.27.0",
    "anyio>=4.0,<5",
    "redis>=5.0.0",
    "numpy>=1.26.0",
    "fastembed>=0.8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "fakeredis>=2.22.0",
]
lint = [
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# static/** needs setuptools 62.3+ (recursive globs).
"resilient_triage.api" = ["templates/*.html", "static/**"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "UP042",  # CODING_STANDARDS.md: enums inherit from (str, Enum)
    "B027",   # optional empty method on BaseEmbeddingProvider
    "B017",   # pytest.raises(Exception) in test assertions
    "UP047",  # generic type parameters syntax
]

[tool.ruff.lint.per-file-ignores]
# Prompt text is sent to the LLM verbatim; wrapping it would change the prompt.
"src/resilient_triage/graph/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

