<svg viewBox="0 0 1040 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sm-lifecycle-title sm-lifecycle-desc">
        <title id="sm-lifecycle-title">LangGraph State Machine Lifecycle</title>
        <desc id="sm-lifecycle-desc">State machine lifecycle map showing the primary execution rail, upper adaptive recovery band for circuit breaker trips and self-repair loops, and lower terminal outcomes band.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#a1a1aa"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#a78bfa"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#818cf8"/>
          </marker>
        </defs>

        <!-- Canvas Background -->
        <rect width="100%" height="100%" fill="#09090b"/>

        <!-- ── Horizontal Band Zones (painted before transitions & states) -->
        <!-- Band 1: Upper Recovery & Adaptation Band -->
        <rect x="28" y="96" width="984" height="108" rx="8" fill="rgba(250, 250, 250, 0.02)" stroke="rgba(250, 250, 250, 0.10)" stroke-width="0.8"/>
        <rect x="40" y="100" width="164" height="12" rx="2" fill="#09090b"/>
        <text x="122" y="109" fill="#858591" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ADAPTIVE RECOVERY BAND</text>

        <!-- Band 2: Primary Execution Rail (Happy Path) -->
        <rect x="28" y="216" width="984" height="104" rx="8" fill="rgba(250, 250, 250, 0.02)" stroke="rgba(250, 250, 250, 0.10)" stroke-width="0.8"/>
        <rect x="40" y="220" width="168" height="12" rx="2" fill="#09090b"/>
        <text x="124" y="229" fill="#858591" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PRIMARY EXECUTION RAIL</text>

        <!-- Band 3: Lower Terminal Outcomes Band -->
        <rect x="28" y="332" width="984" height="112" rx="8" fill="rgba(250, 250, 250, 0.02)" stroke="rgba(250, 250, 250, 0.10)" stroke-width="0.8"/>
        <rect x="40" y="336" width="168" height="12" rx="2" fill="#09090b"/>
        <text x="124" y="345" fill="#858591" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TERMINAL RESOLUTION BAND</text>

        <!-- ── Transitions (painted before states) ────────────────────── -->
        <!-- 1. START dot to analyze_query -->
        <line x1="46" y1="270" x2="68" y2="270" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 2. analyze_query to collect_telemetry -->
        <line x1="200" y1="270" x2="268" y2="270" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 3. collect_telemetry to synthesize_telemetry (Happy path: ALL CLOSED) -->
        <line x1="400" y1="270" x2="468" y2="270" stroke="#818cf8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- 4. collect_telemetry to compensate_blindspots (OPEN breaker detour) -->
        <path d="M 334,236 V 166 Q 334,158 342,158 H 368" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

        <!-- 5. compensate_blindspots to synthesize_telemetry (Bridged detour return) -->
        <path d="M 500,158 H 526 Q 534,158 534,166 V 236" fill="none" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 6. synthesize_telemetry to generate_report (Compiled prompt) -->
        <line x1="600" y1="270" x2="668" y2="270" stroke="#a78bfa" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- 7. generate_report to validate_report (Candidate payload) -->
        <line x1="800" y1="270" x2="868" y2="270" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 8. validate_report to self_repair (Invalid & retries < 2) -->
        <path d="M 934,236 V 166 Q 934,158 926,158 H 900" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

        <!-- 9. self_repair to generate_report (Re-prompt with Pydantic traceback) -->
        <path d="M 768,158 H 742 Q 734,158 734,166 V 236" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

        <!-- 10. validate_report to fallback_report (Retries exhausted >= 2) -->
        <line x1="934" y1="304" x2="934" y2="356" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- 11. validate_report to finalize_report (Pass & Confidence >= 0.60) -->
        <path d="M 880,304 V 332 Q 880,340 872,340 H 742 Q 734,340 734,348 V 356" fill="none" stroke="#a78bfa" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- 12. fallback_report to finalize_report (Safe P0 remediation) -->
        <line x1="868" y1="390" x2="800" y2="390" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- 13. finalize_report to END -->
        <line x1="668" y1="390" x2="616" y2="390" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ── Transition Labels (Opaque Mask & 8px visible gap) ─────── -->
        <!-- Label 1: TARGET -->
        <rect x="216" y="254" width="36" height="12" rx="2" fill="#09090b"/>
        <text x="234" y="263" fill="#858591" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INIT</text>

        <!-- Label 2: ALL CLOSED -->
        <rect x="404" y="254" width="60" height="12" rx="2" fill="#09090b"/>
        <text x="434" y="263" fill="#818cf8" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLOSED</text>

        <!-- Label 3: BREAKER OPEN -->
        <rect x="312" y="196" width="68" height="12" rx="2" fill="#09090b"/>
        <text x="346" y="205" fill="#a78bfa" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPEN &#8805;3</text>

        <!-- Label 4: BRIDGED (0.70) -->
        <rect x="496" y="196" width="68" height="12" rx="2" fill="#09090b"/>
        <text x="530" y="205" fill="#858591" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BRIDGED</text>

        <!-- Label 5: INFER -->
        <rect x="608" y="254" width="52" height="12" rx="2" fill="#09090b"/>
        <text x="634" y="263" fill="#a78bfa" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYNTH</text>

        <!-- Label 6: RAW JSON -->
        <rect x="808" y="254" width="52" height="12" rx="2" fill="#09090b"/>
        <text x="834" y="263" fill="#858591" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RAW JSON</text>

        <!-- Label 7: RETRY < 2 -->
        <rect x="898" y="196" width="56" height="12" rx="2" fill="#09090b"/>
        <text x="926" y="205" fill="#a78bfa" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETRY&lt;2</text>

        <!-- Label 8: TRACEBACK -->
        <rect x="704" y="196" width="60" height="12" rx="2" fill="#09090b"/>
        <text x="734" y="205" fill="#a78bfa" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RE-PROMPT</text>

        <!-- Label 9: FAIL >= 2 -->
        <rect x="946" y="324" width="52" height="12" rx="2" fill="#09090b"/>
        <text x="972" y="333" fill="#858591" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAIL &#8805;2</text>

        <!-- Label 10: PASS (CONF >= .6) -->
        <rect x="768" y="334" width="88" height="12" rx="2" fill="#09090b"/>
        <text x="812" y="343" fill="#a78bfa" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PASS (CONF&#8805;.6)</text>

        <!-- Label 11: SAFE P0 -->
        <rect x="814" y="372" width="48" height="12" rx="2" fill="#09090b"/>
        <text x="838" y="381" fill="#858591" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAFE P0</text>

        <!-- Label 12: EMIT -->
        <rect x="624" y="372" width="36" height="12" rx="2" fill="#09090b"/>
        <text x="642" y="381" fill="#858591" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EMIT</text>

        <!-- ── Start State Marker ────────────────────────────────────── -->
        <circle cx="40" cy="270" r="6" fill="#fafafa"/>

        <!-- ── State 1: analyze_query (Rail Node 1) ──────────────────── -->
        <rect x="68" y="236" width="132" height="68" rx="8" fill="#09090b"/>
        <rect x="68" y="236" width="132" height="68" rx="8" fill="#18181b" stroke="#fafafa" stroke-width="1"/>
        <rect x="76" y="244" width="34" height="12" rx="2" fill="transparent" stroke="rgba(250, 250, 250, 0.40)" stroke-width="0.8"/>
        <text x="93" y="253" fill="#fafafa" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE 1</text>
        <text x="134" y="271" fill="#fafafa" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">analyze_query</text>
        <text x="134" y="289" fill="#a1a1aa" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">Scope &amp; Tool Selector</text>

        <!-- ── State 2: collect_telemetry (Rail Node 2) ──────────────── -->
        <rect x="268" y="236" width="132" height="68" rx="8" fill="#09090b"/>
        <rect x="268" y="236" width="132" height="68" rx="8" fill="#18181b" stroke="#818cf8" stroke-width="1"/>
        <rect x="276" y="244" width="34" height="12" rx="2" fill="transparent" stroke="rgba(129, 140, 248, 0.40)" stroke-width="0.8"/>
        <text x="293" y="253" fill="#818cf8" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE 2</text>
        <text x="334" y="271" fill="#fafafa" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">collect_telemetry</text>
        <text x="334" y="289" fill="#a1a1aa" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">async gather Probes</text>

        <!-- ── State 3: compensate_blindspots (Recovery Detour 1) ─────── -->
        <rect x="368" y="124" width="132" height="68" rx="8" fill="#09090b"/>
        <rect x="368" y="124" width="132" height="68" rx="8" fill="rgba(167, 139, 250, 0.08)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3"/>
        <rect x="376" y="132" width="46" height="12" rx="2" fill="transparent" stroke="rgba(167, 139, 250, 0.40)" stroke-width="0.8"/>
        <text x="399" y="141" fill="#a78bfa" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RECOVERY</text>
        <text x="434" y="159" fill="#fafafa" font-size="11.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">compensate_blind</text>
        <text x="434" y="177" fill="#a1a1aa" font-size="8.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Cache 0.70 + Degraded</text>

        <!-- ── State 4: synthesize_telemetry (Rail Node 3) ────────────── -->
        <rect x="468" y="236" width="132" height="68" rx="8" fill="#09090b"/>
        <rect x="468" y="236" width="132" height="68" rx="8" fill="#18181b" stroke="#fafafa" stroke-width="1"/>
        <rect x="476" y="244" width="34" height="12" rx="2" fill="transparent" stroke="rgba(250, 250, 250, 0.40)" stroke-width="0.8"/>
        <text x="493" y="253" fill="#fafafa" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE 4</text>
        <text x="534" y="271" fill="#fafafa" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">synthesize_ctx</text>
        <text x="534" y="289" fill="#a1a1aa" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">Compile System Prompt</text>

        <!-- ── State 5: generate_report (Rail Node 4 - FOCAL ACCENT 1) ── -->
        <rect x="668" y="236" width="132" height="68" rx="8" fill="#09090b"/>
        <rect x="668" y="236" width="132" height="68" rx="8" fill="rgba(167, 139, 250, 0.12)" stroke="#a78bfa" stroke-width="1.2"/>
        <rect x="676" y="244" width="36" height="12" rx="2" fill="transparent" stroke="rgba(167, 139, 250, 0.50)" stroke-width="0.8"/>
        <text x="694" y="253" fill="#a78bfa" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INFER</text>
        <text x="792" y="296" fill="rgba(167, 139, 250, 0.12)" font-size="28" font-weight="600" font-family="'JetBrains Mono', monospace" text-anchor="end">01</text>
        <text x="734" y="271" fill="#ffffff" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">generate_report</text>
        <text x="734" y="289" fill="#a1a1aa" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">Groq LPU + Failover</text>

        <!-- ── State 6: self_repair (Recovery Detour 2) ───────────────── -->
        <rect x="768" y="124" width="132" height="68" rx="8" fill="#09090b"/>
        <rect x="768" y="124" width="132" height="68" rx="8" fill="rgba(167, 139, 250, 0.08)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3"/>
        <rect x="776" y="132" width="46" height="12" rx="2" fill="transparent" stroke="rgba(167, 139, 250, 0.40)" stroke-width="0.8"/>
        <text x="799" y="141" fill="#a78bfa" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPAIR</text>
        <text x="834" y="159" fill="#fafafa" font-size="11.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">self_repair_loop</text>
        <text x="834" y="177" fill="#a1a1aa" font-size="8.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Inject Traceback (Max 2)</text>

        <!-- ── State 7: validate_report (Rail Node 5 - CONTRACT GUARD) ── -->
        <rect x="868" y="236" width="132" height="68" rx="8" fill="#09090b"/>
        <rect x="868" y="236" width="132" height="68" rx="8" fill="#18181b" stroke="#fafafa" stroke-width="1"/>
        <rect x="876" y="244" width="34" height="12" rx="2" fill="transparent" stroke="rgba(250, 250, 250, 0.40)" stroke-width="0.8"/>
        <text x="893" y="253" fill="#fafafa" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GUARD</text>
        <text x="934" y="271" fill="#fafafa" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">validate_report</text>
        <text x="934" y="289" fill="#a1a1aa" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">extra="forbid" &middot; 4-Way</text>

        <!-- ── State 8: finalize_report (Outcome 1 - FOCAL ACCENT 2) ───── -->
        <rect x="668" y="356" width="132" height="68" rx="8" fill="#09090b"/>
        <rect x="668" y="356" width="132" height="68" rx="8" fill="rgba(167, 139, 250, 0.12)" stroke="#a78bfa" stroke-width="1.2"/>
        <rect x="676" y="364" width="36" height="12" rx="2" fill="transparent" stroke="rgba(167, 139, 250, 0.50)" stroke-width="0.8"/>
        <text x="694" y="373" fill="#a78bfa" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COMMIT</text>
        <text x="792" y="416" fill="rgba(167, 139, 250, 0.12)" font-size="28" font-weight="600" font-family="'JetBrains Mono', monospace" text-anchor="end">02</text>
        <text x="734" y="391" fill="#ffffff" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">finalize_report</text>
        <text x="734" y="409" fill="#a1a1aa" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">Audit CBs + Cache Set</text>

        <!-- ── State 9: fallback_report (Outcome 2 - SAFE HEURISTIC) ──── -->
        <rect x="868" y="356" width="132" height="68" rx="8" fill="#09090b"/>
        <rect x="868" y="356" width="132" height="68" rx="8" fill="rgba(250, 250, 250, 0.04)" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="3,3"/>
        <rect x="876" y="364" width="46" height="12" rx="2" fill="transparent" stroke="rgba(161, 161, 170, 0.40)" stroke-width="0.8"/>
        <text x="899" y="373" fill="#a1a1aa" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FAILSAFE</text>
        <text x="934" y="391" fill="#fafafa" font-size="11.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">fallback_report</text>
        <text x="934" y="409" fill="#a1a1aa" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">Guaranteed P0 Plan</text>

        <!-- ── End State Marker (ringed dot) ─────────────────────────── -->
        <circle cx="608" cy="390" r="8" fill="none" stroke="#fafafa" stroke-width="1.2"/>
        <circle cx="608" cy="390" r="5" fill="#fafafa"/>

        <!-- ── Legend Strip ──────────────────────────────────────────── -->
        <line x1="40" y1="472" x2="1000" y2="472" stroke="rgba(250, 250, 250, 0.12)" stroke-width="0.8"/>
        <text x="48" y="498" fill="#a1a1aa" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <!-- Item 1: Focal States -->
        <rect x="120" y="490" width="14" height="10" rx="2" fill="rgba(167, 139, 250, 0.15)" stroke="#a78bfa" stroke-width="1"/>
        <text x="142" y="498" fill="#a1a1aa" font-size="9" font-family="'JetBrains Mono', monospace">Focal State</text>

        <!-- Item 2: Core Graph Node -->
        <rect x="238" y="490" width="14" height="10" rx="2" fill="#18181b" stroke="#fafafa" stroke-width="1"/>
        <text x="260" y="498" fill="#a1a1aa" font-size="9" font-family="'JetBrains Mono', monospace">Deterministic Node</text>

        <!-- Item 3: Compensatory / Degraded -->
        <rect x="408" y="490" width="14" height="10" rx="2" fill="rgba(167, 139, 250, 0.08)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="430" y="498" fill="#a1a1aa" font-size="9" font-family="'JetBrains Mono', monospace">Compensatory Branch</text>

        <!-- Item 4: Start & Terminal State -->
        <circle cx="600" cy="495" r="5" fill="#fafafa"/>
        <circle cx="620" cy="495" r="6" fill="none" stroke="#fafafa" stroke-width="1"/>
        <circle cx="620" cy="495" r="3.5" fill="#fafafa"/>
        <text x="636" y="498" fill="#a1a1aa" font-size="9" font-family="'JetBrains Mono', monospace">Start / Terminal</text>

        <!-- Item 5: Reflection / Self-Repair Cycle -->
        <line x1="772" y1="495" x2="798" y2="495" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
        <text x="808" y="498" fill="#a1a1aa" font-size="9" font-family="'JetBrains Mono', monospace">Self-Repair Cycle</text>

        <!-- Item 6: External Conduit -->
        <line x1="930" y1="495" x2="956" y2="495" stroke="#818cf8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="966" y="498" fill="#a1a1aa" font-size="9" font-family="'JetBrains Mono', monospace">Probe Path</text>

      </svg>