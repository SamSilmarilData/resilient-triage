name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Pytest Suite with Redis Stack
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      redis:
        image: redis/redis-stack-server:7.4.0-v8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache FastEmbed Model Weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5
          restore-keys: |
            fastembed-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,lint]"

      - name: Run Ruff Checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy Type Checking
        run: |
          mypy src/

      - name: Run Pytest Suite
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/ -v --durations=10

  docker:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t resilient-triage:ci .

      - name: Verify Container Boot & Health
        run: |
          docker run -d --name test-app -p 8000:8000 resilient-triage:ci
          # Startup downloads the embedding model, so poll /health instead of a fixed sleep.
          deadline=$((SECONDS + 120))
          until curl --fail --silent --show-error --max-time 5 http://localhost:8000/health; do
            if [ "$(docker inspect -f '{{.State.Running}}' test-app)" != "true" ]; then
              echo "::error::Container exited before becoming healthy"
              docker logs test-app
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::/health not ready within 120s"
              docker logs test-app
              exit 1
            fi
            sleep 2
          done

      - name: Clean Up Container
        if: always()
        run: docker rm -f test-app || true
