name: CI

on:
  push:
    branches: [main, "integration/**"]
  pull_request:
    branches: [main, "integration/**"]

jobs:
  test:
    name: Run Pytest Suite with Redis Stack
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      redis:
        image: redis/redis-stack-server:7.4.0-v8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # FastEmbed reads FASTEMBED_CACHE_PATH (default: $TMPDIR/fastembed_cache); the download
      # step below points it here so this cache actually holds the model.
      - name: Cache FastEmbed Model Weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5
          restore-keys: |
            fastembed-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,lint]"

      # Tests run offline (tests/conftest.py blocks non-loopback connections), so fetch the
      # embedding model here. TextEmbedding raises if it can't load, unlike FastEmbedProvider.
      - name: Download Embedding Model
        run: |
          echo "FASTEMBED_CACHE_PATH=$HOME/.cache/fastembed" >> "$GITHUB_ENV"
          export FASTEMBED_CACHE_PATH="$HOME/.cache/fastembed"
          python -c "from fastembed import TextEmbedding; from resilient_triage.config import settings; TextEmbedding(model_name=settings.embedding_model)"

      - name: Run Ruff Checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy Type Checking
        run: |
          mypy src/

      - name: Run Pytest Suite
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/ -v --durations=10

  docker:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    env:
      # Admin routes fail closed (403) without a key (#107); a fixed test value, not a secret.
      ADMIN_API_KEY: ci-smoke-admin-key

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t resilient-triage:ci .

      - name: Verify Container Boot & Health
        run: |
          docker run -d --name test-app -p 8000:8000 -e ADMIN_API_KEY resilient-triage:ci
          # Startup downloads the embedding model, so poll /health instead of a fixed sleep.
          deadline=$((SECONDS + 120))
          until curl --fail --silent --show-error --max-time 5 http://localhost:8000/health; do
            if [ "$(docker inspect -f '{{.State.Running}}' test-app)" != "true" ]; then
              echo "::error::Container exited before becoming healthy"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::/health not ready within 120s"
              exit 1
            fi
            sleep 2
          done

      # The smoke script needs only httpx and the stdlib when pointed at a running server.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Live Smoke Test
        run: |
          python -m pip install httpx
          python scripts/smoke_test.py --url http://localhost:8000 --admin-key "$ADMIN_API_KEY"

      - name: Print Container Logs
        if: failure()
        run: docker logs test-app || true

      - name: Clean Up Container
        if: always()
        run: docker rm -f test-app || true
